name: Build and Deploy Telegram Bot

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Create deployment directory
            mkdir -p /home/${{ secrets.SSH_USER }}/movie-treasure-trove/data
            cd /home/${{ secrets.SSH_USER }}/movie-treasure-trove

            # Write docker-compose.yml
            cat << 'EOF' > docker-compose.yml
            services:
              bot:
                image: ghcr.io/${{ github.repository }}:latest
                container_name: movie-treasure-trove
                restart: unless-stopped
                cpus: 0.8
                cpu_shares: 512
                mem_limit: 1024m
                deploy:
                  resources:
                    limits:
                      cpus: '0.8'
                      memory: 1024M
                env_file:
                  - .env
                volumes:
                  - ./data:/app/data
                environment:
                  - DATABASE_PATH=/app/data/bot_database.db
                  - CPU_THREADS=1
                  - TORCH_NUM_THREADS=1
                  - OMP_NUM_THREADS=1
                  - MKL_NUM_THREADS=1
                  - OPENBLAS_NUM_THREADS=1
                  - NUMEXPR_NUM_THREADS=1
                  - TELEGRAM_CONCURRENT_UPDATES=4
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "3"
            EOF

            # Write .env file
            cat << 'EOF' > .env
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            KINOPOISK_API_KEY=${{ secrets.KINOPOISK_API_KEY }}
            DATABASE_PATH=/app/data/bot_database.db
            EOF

            # Login to GHCR to pull the image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull and restart using docker compose
            if docker compose version >/dev/null 2>&1; then
              docker compose pull
              docker compose up -d --remove-orphans
            else
              docker-compose pull
              docker-compose up -d --remove-orphans
            fi

            # Logout from GHCR
            docker logout ghcr.io
