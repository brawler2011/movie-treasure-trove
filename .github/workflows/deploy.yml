name: Build and Deploy Telegram Bot

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build WebApp frontend
        run: |
          cd webapp
          npm install
          npm run build

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            # Create deployment directory
            mkdir -p /home/${{ secrets.SSH_USER }}/movie-treasure-trove/data
            cd /home/${{ secrets.SSH_USER }}/movie-treasure-trove

            # Write docker-compose.yml
            cat << 'EOF' > docker-compose.yml
            services:
              bot:
                image: ghcr.io/${{ github.repository }}:latest
                container_name: movie-treasure-trove
                restart: unless-stopped
                cpus: 0.8
                cpu_shares: 512
                mem_limit: 1024m
                deploy:
                  resources:
                    limits:
                      cpus: '0.8'
                      memory: 1024M
                env_file:
                  - .env
                volumes:
                  - ./data:/app/data
                environment:
                  - DATABASE_PATH=/app/data/bot_database.db
                  - CPU_THREADS=1
                  - TORCH_NUM_THREADS=1
                  - OMP_NUM_THREADS=1
                  - MKL_NUM_THREADS=1
                  - OPENBLAS_NUM_THREADS=1
                  - NUMEXPR_NUM_THREADS=1
                  - TELEGRAM_CONCURRENT_UPDATES=4
                  - API_HOST=0.0.0.0
                  - API_PORT=8080
                  - WEBAPP_PORT=8080
                  - WEBAPP_URL=https://kino.steins.ru
                labels:
                  - "traefik.enable=true"
                  - "traefik.http.routers.kino.entrypoints=websecure"
                  - "traefik.http.routers.kino.rule=Host(`kino.steins.ru`)"
                  - "traefik.http.routers.kino.service=kino-svc"
                  - "traefik.http.routers.kino.tls=true"
                  - "traefik.http.routers.kino.tls.certresolver=letsencrypt"
                  - "traefik.http.middlewares.kino-headers.headers.customresponseheaders.X-Frame-Options=ALLOWALL"
                  - "traefik.http.middlewares.kino-headers.headers.contentsecuritypolicy=frame-ancestors 'self' https://web.telegram.org https://*.telegram.org https://telegram.org"
                  - "traefik.http.routers.kino.middlewares=kino-headers"
                  - "traefik.http.services.kino-svc.loadbalancer.server.port=8080"
                networks:
                  - default
                  - traefik-network
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "3"

            networks:
              default:
              traefik-network:
                external: true
            EOF

            # Write .env file
            cat << 'EOF' > .env
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            KINOPOISK_API_KEY=${{ secrets.KINOPOISK_API_KEY }}
            DATABASE_PATH=/app/data/bot_database.db
            API_HOST=0.0.0.0
            API_PORT=8080
            WEBAPP_PORT=8080
            WEBAPP_URL=https://kino.steins.ru
            EOF

            # Login to GHCR to pull the image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Prune old images and build cache to keep sufficient disk space
            docker system prune -af --filter "until=48h" || true

            # Pull and restart using docker compose
            if docker compose version >/dev/null 2>&1; then
              docker compose pull
              docker compose up -d --remove-orphans
            else
              docker-compose pull
              docker-compose up -d --remove-orphans
            fi

            # Clean up dangling images
            docker image prune -f || true

            # Logout from GHCR
            docker logout ghcr.io
